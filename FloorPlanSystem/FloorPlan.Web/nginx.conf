server {
    listen 80;

    server_name _;


    # ========================================================
    # REACT BUILD
    # ========================================================

    root /usr/share/nginx/html;

    index index.html;


    # Floor-plan uploads can be relatively large.
    client_max_body_size 50M;


    # ========================================================
    # ASP.NET API
    # ========================================================
    #
    # Browser:
    #
    # /api/detection
    #
    # becomes:
    #
    # http://floorplan-api:8080/api/detection
    # ========================================================

    location /api/ {

        proxy_pass http://floorplan-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        # Detection can take some time.
        proxy_connect_timeout 60s;

        proxy_send_timeout 300s;

        proxy_read_timeout 300s;
    }


    # ========================================================
    # UPLOADED FLOOR PLAN IMAGES
    # ========================================================

    location /uploads/ {

        proxy_pass http://floorplan-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================================================
    # REACT ROUTER
    # ========================================================
    #
    # If the user opens:
    #
    # /floorplans/5
    #
    # Nginx must return index.html so React Router handles it.
    # ========================================================

    location / {

        try_files $uri $uri/ /index.html;
    }
}